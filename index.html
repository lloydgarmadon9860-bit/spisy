  document.body.classList.add(k);await sleep(k==='flip'?900:600);document.body.classList.remove(k)}
function glitchLoop(){setTimeout(async()=>{if(!busy){document.body.classList.add('gl');if(Math.random()<.35)line('<span class="r glitch">'+['…vidíme tě, agente…','ORION VÍ, KDE JSI','neotvírej spis 047','pomoc… jsem pořád uvnitř','signál narušen'][Math.floor(Math.random()*5)]+'</span>');await sleep(700);document.body.classList.remove('gl');const r=Math.random();if(r<.15)await errScreen();else if(r<.55)await bigGlitch()}glitchLoop()},30000+Math.random()*40000)}
async function splash(){const b=document.getElementById('spb'),m=document.getElementById('spm'),sp=document.getElementById('sp');
  const st=['spouštím systém ORION…','ověřuji identitu agenta…','skenuji otisk prstu…','připojuji se k serveru ORION-7…','dešifruji archiv…','načítám spisy…','obcházím bezpečnostní protokol…','přístup povolen ✓'];
  for(let i=0;i<st.length;i++){m.textContent=st[i];b.style.width=Math.round((i+1)/st.length*100)+'%';await sleep(850+Math.random()*450)}
  await sleep(900);sp.style.opacity=0;await sleep(600);sp.remove();cmd.focus()}
(async()=>{await splash();glitchLoop();await type(`<span class="c">◆ ORION CORP</span> · interní terminál\n<span class="w">SPISY.exe v${VERSION}</span>  ·  archiv nevyřešených případů
