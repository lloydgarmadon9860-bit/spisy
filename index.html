<script>
const VERSION='1.5';
const out=document.getElementById('out'),cmd=document.getElementById('cmd'),T=document.getElementById('t');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let busy=false,hist=[],hi=0,openDb=null,lastList=[];
function line(h=''){const d=document.createElement('div');d.innerHTML=h;out.appendChild(d);T.scrollTop=1e9;return d}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function type(h,speed=4){const d=line('');let i=0;while(i<h.length){if(h[i]==='<'){const j=h.indexOf('>',i);i=j+1}else i+=speed;d.innerHTML=h.slice(0,i);T.scrollTop=1e9;await sleep(8)}d.innerHTML=h}
/* seeded random */
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hash(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const P=(r,a)=>a[Math.floor(r()*a.length)];
const M=['Jakub','Tomáš','Lukáš','Matěj','Adam','Ondřej','Filip','Vojtěch','Dominik','Marek','Petr','Jan','Martin','Radek','Štěpán','Kryštof','Daniel','Viktor','Patrik','Roman'];

function genFile(db,n){
  const r=rng(hash(db+'#'+n));const fem=r()<.5;const nm=P(r,fem?F:M),sur=P(r,SUR)[fem?1:0];
  const st=P(r,STAT_OLD),year=1984+Math.floor(r()*41),mon=1+Math.floor(r()*12),day=1+Math.floor(r()*28),hh=Math.floor(r()*24),mm=Math.floor(r()*60);
  const clues=[...CLUE].map(c=>c.replace('bydlel/a',fem?'bydlela':'bydlel')).sort(()=>r()-.5).slice(0,2+Math.floor(r()*3));
  const w=[...new Set([...Array(1+Math.floor(r()*2))].map(()=>P(r,WIT)+': '+P(r,SAY).replace(/ho\/ji/g,fem?'ji':'ho').replace(/ho\/jí/g,fem?'jí':'ho')))];

  return {n,db,born:`${1+Math.floor(r()*28)}. ${1+Math.floor(r()*12)}. ${year-age0}`,name:nm+' '+sur,fem,age:age0,job:P(r,JOB),city:P(r,CITY),place:P(r,PLACE),st,date:`${day}. ${mon}. ${year}`,time:`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`,clues,w,
    h:150+Math.floor(r()*45),eyes:P(r,['hnědé','modré','zelené','šedé','oříškové']),note:P(r,NOTE).replace('{n}',String(other).padStart(3,'0')),corrupt:r()<.08,redact:r()<.3,id:'CZ-'+(hash(db+n)%90000+10000)};

const ANI=[['vlk','🐺'],['liška','🦊'],['rys','🐱'],['sova','🦉'],['havran','🐦‍⬛'],['netopýr','🦇'],['králík','🐰'],['tygr','🐯'],['žralok','🦈'],['had','🐍'],['jelen','🦌'],['medvěd','🐻'],['hyena','🐕'],['gepard','🐆'],['krysa','🐀'],['drak (nestabilní)','🐉'],['kočka','🐈'],['orel','🦅']];

const ANOTE=['Subjekt reaguje na své staré jméno.','Proměna překročila 100 %. Pokračovat?','Někdo z personálu subjektu pomáhá.','Kamery v cele vypadávají každou noc ve 3:33.','Subjekt nakreslil mapu ven z laboratoře.','Vedení nařídilo všechny záznamy smazat.','Subjekt #{n} byl viděn ve stejné cele.','Sérum ORN-7 má vedlejší účinky, které tajíme.'];
function genAlpha(n){
  const r=rng(hash('alpha#orion#'+n));const fem=r()<.5;const nm=P(r,fem?F:M),sur=P(r,SUR)[fem?1:0];
  const a=P(r,ANI),alive=r()<.6,y=2019+Math.floor(r()*7),mo=1+Math.floor(r()*12),d=1+Math.floor(r()*28),age=12+Math.floor(r()*40);

const stOf=(db,n)=>isSolved(db,n)?['POTVRZENO ✓','w']:['NEPOTVRZENO','y'];

const SECT={id:'🪪 id',foto:'📷 foto',info:'📋 info',posledni:'📍 posledni',dukazy:'🔎 dukazy',svedectvi:'🗣️ svedectvi',poznamka:'📝 poznamka',stav:'⚖️ stav'};

  const f=getF(db,n);curFile=f;openDb=db;setPs();busy=true;const st=stOf(db,n);
  line(`<span class="d">◆ ORION CORP · otevírám ${esc(fname(f))}/ …</span>`);{const L=line('<span class="ol"><i></i></span>'),i=L.querySelector('i');for(let p=0;p<=100;p+=3+Math.random()*5){i.style.width=Math.min(100,p)+'%';await sleep(90)}i.style.width='100%';await sleep(200);L.remove()}

  ${f.date}, ${f.time} — ${esc(f.place)}${f.redact?' <span class="red">██████████</span>':''}`);
  if(k==='dukazy')await type(`<span class="c">▸ DŮKAZY</span>\n${f.clues.map(c=>'  • '+esc(c)).join('\n')}`);
  if(k==='svedectvi')await type(`<span class="c">▸ SVĚDECTVÍ</span>\n${f.w.map(c=>'  „'+esc(c)+'“').join('\n')}`);
  if(k==='poznamka')await type(`<span class="c">▸ POZNÁMKA VYŠETŘOVATELE</span>\n  <span class="y">${esc(f.note)}</span>`);
  if(k==='stav')line(`stav: <span class="${stOf(db,n)[1]}">${stOf(db,n)[0]}</span>`);
  busy=false;
}
async function solve(){
  const f=curFile;if(isSolved(f.db,f.n))return line('<span class="d">tenhle spis už je potvrzený ✓</span>');
  busy=true;for(const t of ['ověřuji důkazy …','porovnávám svědectví …','podepisuji spis …']){line('<span class="d">'+t+'</span>');await sleep(450)}
  solved[f.db+'#'+f.n]=Date.now();localStorage.setItem('spisy_solved',JSON.stringify(solved));
  await type(`<span class="w">══════════════════════════════</span>
<span class="w">  ✅ SPIS ${esc(f.name)} POTVRZEN</span>
<span class="w">══════════════════════════════</span>
<span class="d">potvrzeno ${Object.keys(solved).filter(k=>k.startsWith(f.db+'#')).length} spisů v „${esc(f.db)}“</span>`,10);busy=false;
}
async function listFiles(db,a,b){
  openDb=db;curFile=null;setPs();lastList=[];line(`<span class="d">◆ ORION CORP · načítám databázi „${esc(db)}“ …</span>`);{const L=line('<span class="ol"><i></i></span>'),i=L.querySelector('i');for(let p=0;p<=100;p+=3+Math.random()*4){i.style.width=Math.min(100,p)+'%';await sleep(90)}i.style.width='100%';await sleep(200);L.remove()}
  if(db==='alpha')await type(`<span class="c">╔══════════════════════════════╗
║   ◆ ORION CORP ◆  PROJEKT CHIMÉRA   ║
╚══════════════════════════════╝</span>
<span class="r">PŘÍSNĚ TAJNÉ · subjekty experimentů</span>`,20);
  line(`<span class="y">📁 ${esc(db)}/  (${b-a+1} složek)</span>  <span class="d">napiš jméno ze složky (např. ${esc(fname(getF(db,a)))}) nebo na ni klikni</span>`);
  let h='';for(let n=a;n<=b;n++){const f=getF(db,n);lastList.push(n);
    h+=`<span class="dir" data-n="${n}">📁 ${esc(f.corrupt?'▓▒░_POŠKOZENO':fname(f))}/</span>${f.alpha?' <span class="d">'+f.emo+'</span>':''}\n`}
  await type(h,40);
}
function help(){line(`<span class="w">PŘÍKAZY</span>
  file NÁZEV 1-75   ukáže složky se jmény 1–75
  file alpha 1-75   tajné spisy Orion Corp (experimenty)
  JMÉNO             otevře celý spis (např. tereza_novakova)
  file NÁZEV 12     rovnou otevře spis 12
  open 12           otevře spis z poslední databáze
  vyřešeno          potvrdí otevřený spis
  zpet              zavře spis
  random            otevře náhodný spis
  search SLOVO      najde spisy podle jména, města nebo důkazu
  ls                vypíše poslední databázi znovu
  clear             vyčistí obrazovku
  date              čas a datum
<span class="d">Všechny spisy začínají jako NEPOTVRZENO. Stejný název + číslo = vždy stejný spis.</span>`)}
async function run(c){
  const p=c.trim().split(/\s+/),k=(p[0]||'').toLowerCase();
  if(!k)return;
  const nk=norm(k);
  if(curFile&&SECT[nk])return showFile(curFile.db,curFile.n);
  if(['vyreseno','potvrzeno','potvrdit','vyreseno.','vyresit','solve'].includes(nk)){if(!curFile)return line('<span class="r">nejdřív otevři spis</span>');return solve()}
  if(['zpet','back','exit','..'].includes(nk)||(k==='cd'&&p[1]==='..')){curFile=null;setPs();return line('<span class="d">spis zavřen</span>')}
  if(k==='help'||k==='?')return help();
  if(k==='clear'||k==='cls'){out.innerHTML='';return}
  if(k==='date')return line(new Date().toLocaleString('cs-CZ'));
  if(k==='whoami')return line('agent #047 · přístup: <span class="y">OMEZENÝ</span>');
  if(k==='file'){const db=(p[1]||'').toLowerCase(),rg=p[2]||'';if(!db)return line('<span class="r">použití: file NÁZEV 1-75</span>');
    let m=rg.match(/^(\d+)-(\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];if(b-a>499)return line('<span class="r">max 500 složek najednou</span>');return listFiles(db,Math.max(1,a),b)}
    if(/^\d+$/.test(rg)){openDb=db;return showFile(db,+rg)}return listFiles(db,1,75)}
  if(k==='open'||k==='cd'){const n=parseInt(p[1]);if(!openDb)return line('<span class="r">nejdřív napiš: file NÁZEV 1-75</span>');if(!n)return line('<span class="r">použití: open ČÍSLO</span>');return showFile(openDb,n)}
  if(k==='random'){const db=openDb||'test';openDb=db;return showFile(db,1+Math.floor(Math.random()*(lastList.length||75)))}
  if(k==='ls'||k==='dir'){if(!openDb)return line('<span class="d">(prázdné) napiš: file test 1-75</span>');return listFiles(openDb,lastList[0]||1,lastList[lastList.length-1]||75)}
  if(k==='search'){const q=p.slice(1).join(' ').toLowerCase();if(!openDb||!q)return line('<span class="r">použití: search SLOVO (po příkazu file)</span>');
    const hits=(lastList.length?lastList:[...Array(75)].map((_,i)=>i+1)).map(n=>getF(openDb,n)).filter(f=>[f.name,f.city,f.place||'',f.job||'',f.animal||'',...(f.clues||[])].join(' ').toLowerCase().includes(q));
    return line(hits.length?hits.map(f=>`<span class="dir" data-n="${f.n}">spis_${pad(f.n)}/</span> <span class="d">${esc(f.name)} · ${esc(f.city)}</span>`).join('\n'):'nic nenalezeno')}
  {const q=norm(c.trim()).replace(/[\s/]+/g,'_').replace(/_+$/,'');const pool=lastList.length?lastList:(openDb?[...Array(75)].map((_,i)=>i+1):[]);
   if(openDb&&q.length>2){const hit=pool.find(n=>fname(getF(openDb,n))===q)||pool.find(n=>fname(getF(openDb,n)).includes(q));if(hit)return showFile(openDb,hit)}}
  if(k==='sudo')return line('<span class="r">pěkný pokus 😏 přístup odepřen</span>');
  line(`<span class="r">neznámý příkaz: ${esc(k)}</span> — napiš <span class="w">help</span>`);
}
cmd.addEventListener('keydown',async e=>{
  if(e.key==='Enter'&&!busy){const c=cmd.value;cmd.value='';line(`<span class="d">${document.getElementById('ps').textContent}</span> ${esc(c)}`);if(c.trim()){hist.push(c);hi=hist.length}await run(c)}
  if(e.key==='ArrowUp'&&hi>0){cmd.value=hist[--hi];e.preventDefault()}
  if(e.key==='ArrowDown'){hi=Math.min(hist.length,hi+1);cmd.value=hist[hi]||''}
});
out.addEventListener('click',e=>{const d=e.target.closest('.dir');if(d&&!busy&&d.dataset.s){line(`<span class="d">${document.getElementById('ps').textContent}</span> ${d.dataset.s}`);return run(d.dataset.s)}if(d&&!busy){line(`<span class="d">agent@spisy:~$</span> open ${d.dataset.n}`);showFile(openDb,+d.dataset.n)}});
T.addEventListener('click',e=>{if(!e.target.closest('.dir')&&!getSelection().toString())cmd.focus()});
async function splash(){const b=document.getElementById('spb'),m=document.getElementById('spm'),sp=document.getElementById('sp');
  const st=['spouštím systém ORION…','ověřuji identitu agenta…','skenuji otisk prstu…','připojuji se k serveru ORION-7…','dešifruji archiv…','načítám spisy…','obcházím bezpečnostní protokol…','přístup povolen ✓'];
  for(let i=0;i<st.length;i++){m.textContent=st[i];b.style.width=Math.round((i+1)/st.length*100)+'%';await sleep(850+Math.random()*450)}
  await sleep(900);sp.style.opacity=0;await sleep(600);sp.remove();cmd.focus()}
(async()=>{await splash();await type(`<span class="c">◆ ORION CORP</span> · interní terminál\n<span class="w">SPISY.exe v${VERSION}</span>  ·  archiv nevyřešených případů
<span class="d">[ok] připojení k archivu
[ok] dešifrování
[!!] některé spisy jsou poškozené</span>
<span class="d">Všechny osoby a příběhy jsou smyšlené.</span>
Napiš <span class="w">help</span> nebo zkus: <span class="y">file test 1-75</span> · <span class="c">file alpha 1-75</span>`,8)})();
</script></body></html>
