<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPISY.exe</title>
<style>
html,body{margin:0;height:100%;background:#020602;color:#4ade80;font:15px/1.45 ui-monospace,Consolas,"Courier New",monospace}
#t{height:100%;overflow:auto;padding:14px 14px 70px;box-sizing:border-box;white-space:pre-wrap;word-break:break-word;text-shadow:0 0 6px #22c55e88}
body:after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 2px,#0003 2px 4px)}
.r{color:#f87171}.y{color:#facc15}.d{color:#166534}.w{color:#e5e7eb}.c{color:#67e8f9}.red{background:#4ade80;color:#4ade80}
.dir{color:#facc15;cursor:pointer;text-decoration:underline}
#in{display:flex;gap:6px;align-items:center}#cmd{flex:1;background:none;border:0;outline:0;color:#4ade80;font:inherit;caret-color:#4ade80}
.idc{display:flex;gap:12px;align-items:stretch;max-width:430px;margin:8px 0;padding:10px;border:1px solid #4ade80;border-radius:10px;background:linear-gradient(135deg,#052e16,#020602);box-shadow:0 0 12px #22c55e44;white-space:normal;font-size:12px;line-height:1.5}
.idc img{width:96px;height:118px;object-fit:cover;border-radius:6px;background:#d1d5db;filter:grayscale(1) contrast(1.15) sepia(.25);border:2px solid #e5e7eb;flex:none}
.idc.cor img{filter:grayscale(1) contrast(3) hue-rotate(90deg) blur(1.5px);animation:g .2s infinite}
.idc .h{color:#e5e7eb;font-weight:700;letter-spacing:1px;font-size:11px}.idc b{color:#e5e7eb}
.idc .st{display:inline-block;margin-top:4px;padding:1px 6px;border:2px solid currentColor;transform:rotate(-6deg);font-weight:700}
.idc .bc{margin-top:4px;height:16px;background:repeating-linear-gradient(90deg,#4ade80 0 2px,#0000 2px 4px,#4ade80 4px 5px,#0000 5px 8px)}
.glitch{animation:g .2s infinite}@keyframes g{50%{opacity:.6;transform:translateX(1px)}}
</style></head><body>
<div id="t"><div id="out"></div><div id="in"><span id="ps">agent@spisy:~$</span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></div></div>
<script>
const VERSION='1.1';
const out=document.getElementById('out'),cmd=document.getElementById('cmd'),T=document.getElementById('t');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let busy=false,hist=[],hi=0,openDb=null,lastList=[];
function line(h=''){const d=document.createElement('div');d.innerHTML=h;out.appendChild(d);T.scrollTop=1e9;return d}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function type(h,speed=4){const d=line('');let i=0;while(i<h.length){if(h[i]==='<'){const j=h.indexOf('>',i);i=j+1}else i+=speed;d.innerHTML=h.slice(0,i);T.scrollTop=1e9;await sleep(8)}d.innerHTML=h}
/* seeded random */
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hash(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const P=(r,a)=>a[Math.floor(r()*a.length)];
const M=['Jakub','Tomáš','Lukáš','Matěj','Adam','Ondřej','Filip','Vojtěch','Dominik','Marek','Petr','Jan','Martin','Radek','Štěpán','Kryštof','Daniel','Viktor','Patrik','Roman'];
const F=['Tereza','Eliška','Anna','Karolína','Natálie','Adéla','Kristýna','Klára','Lucie','Barbora','Veronika','Michaela','Nikola','Simona','Zuzana','Petra','Lenka','Denisa','Markéta','Jana'];
const SUR=[['Novák','Nováková'],['Svoboda','Svobodová'],['Dvořák','Dvořáková'],['Černý','Černá'],['Procházka','Procházková'],['Kučera','Kučerová'],['Veselý','Veselá'],['Horák','Horáková'],['Němec','Němcová'],['Pokorný','Pokorná'],['Marek','Marková'],['Hájek','Hájková'],['Král','Králová'],['Beneš','Benešová'],['Fiala','Fialová'],['Sedláček','Sedláčková'],['Zeman','Zemanová'],['Kolář','Kolářová'],['Vlček','Vlčková'],['Bartoš','Bartošová']];
const CITY=['Ostrava','Opava','Frýdek-Místek','Havířov','Karviná','Nový Jičín','Olomouc','Brno','Praha','Zlín','Šumperk','Jeseník','Třinec','Kopřivnice','Bohumín','Hlučín'];
const PLACE=['opuštěná továrna u řeky','zastávka MHD na konci linky','lesní cesta za vesnicí','parkoviště u nákupního centra','starý důl','nádraží, nástupiště 3','hřbitov u kostela','podchod pod dálnicí','chata u přehrady','zahrádkářská kolonie','opuštěná nemocnice','sídliště, panelák č. 14','benzinka u silnice I/11','kino, poslední představení','park u zámku'];
const JOB=['student','prodavač/ka','řidič/ka autobusu','učitel/ka','programátor/ka','kuchař/ka','zdravotní sestra','hlídač/ka','fotograf/ka','horník','pošťák/pošťačka','knihovník/knihovnice','mechanik','barman/ka','youtuber/ka'];
const STAT=[['NEZVĚSTNÝ','y'],['NEVYŘEŠENO','r'],['UZAVŘENO','d'],['UTAJENO','c'],['NALEZEN/A','w'],['NEVYŘEŠENO','r'],['NEZVĚSTNÝ','y']];
const CLUE=['rozbitý telefon s posledním hovorem v 23:47','jedna bota bez tkaničky','lístek do kina na neexistující film','vzkaz „NEHLEDEJTE MĚ“ psaný obráceně','klíče od bytu, ve kterém nikdy nebydlel/a','polaroid fotka prázdné místnosti','mapa s červeným křížkem u přehrady','kazeta s 12 minutami ticha','deník s vytrženými stránkami 13–19','stopy vedoucí do lesa, které náhle končí','hodinky zastavené na 3:33','neznámé otisky na okně ve 4. patře','SMS „už jdu“ odeslaná 2 dny po zmizení','starý klíč s číslem 47','záznam z kamery: postava v žluté bundě','vlasy jiné barvy na kabátě','kartička z knihovny s divným jménem'];
const WIT=['soused','řidič autobusu','kamarád/ka','prodavačka z večerky','neznámý muž v klobouku','paní venčící psa','bezpečák','bratr/sestra','učitel','taxikář'];
const SAY=['viděl/a ho/ji odcházet směrem k lesu','tvrdí, že slyšel/a hudbu z prázdného bytu','říká, že měl/a strach z „toho auta“','nic neviděl/a, ale ten večer zhasla všechna světla','viděl/a ho/ji mluvit s někým, kdo tam nebyl','tvrdí, že se ho/jí někdo ptal na cestu ke starému dolu','slyšel/a tři rány na dveře','říká, že ho/ji potkal/a o týden později','viděl/a ho/ji naposledy smát se','si všiml/a, že nosil/a dva telefony'];
const NOTE=['Spojitost se spisem #{n} je nejasná.','Svědci si odporují. Doporučuji znovu vyslechnout.','Případ byl předán vyšší složce. Další přístup [ODEPŘEN].','Žluta bunda se objevuje i v jiných spisech.','Číslo 47 se tu opakuje. Náhoda?','Rodina požádala o uzavření spisu.','Na fotce je v odrazu okna někdo další.','Vyšetřovatel případu záhadně odešel z oddělení.','Tento spis by neměl existovat.'];
function genFile(db,n){
  const r=rng(hash(db+'#'+n));const fem=r()<.5;const nm=P(r,fem?F:M),sur=P(r,SUR)[fem?1:0];
  const st=P(r,STAT),year=1984+Math.floor(r()*41),mon=1+Math.floor(r()*12),day=1+Math.floor(r()*28),hh=Math.floor(r()*24),mm=Math.floor(r()*60);
  const clues=[...CLUE].map(c=>c.replace('bydlel/a',fem?'bydlela':'bydlel')).sort(()=>r()-.5).slice(0,2+Math.floor(r()*3));
  const w=[...new Set([...Array(1+Math.floor(r()*2))].map(()=>P(r,WIT)+': '+P(r,SAY).replace(/ho\/ji/g,fem?'ji':'ho').replace(/ho\/jí/g,fem?'jí':'ho')))];
  const other=1+Math.floor(r()*75);
  const age0=9+Math.floor(r()*60);
  return {n,db,born:`${1+Math.floor(r()*28)}. ${1+Math.floor(r()*12)}. ${year-age0}`,name:nm+' '+sur,fem,age:age0,job:P(r,JOB),city:P(r,CITY),place:P(r,PLACE),st,date:`${day}. ${mon}. ${year}`,time:`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`,clues,w,
    h:150+Math.floor(r()*45),eyes:P(r,['hnědé','modré','zelené','šedé','oříškové']),note:P(r,NOTE).replace('{n}',String(other).padStart(3,'0')),corrupt:r()<.08,redact:r()<.3,id:'CZ-'+(hash(db+n)%90000+10000)};
}
function pad(n){return String(n).padStart(3,'0')}
function face(f){const e=f.fem?'(◕ ◕)':'(• •)';return ` ┌────────┐\n │ ${f.corrupt?'▓▒░▓▒░':' '+e+' '}│\n │  ${f.corrupt?'░▓▒░':'\\__/'}  │\n └────────┘`}
async function showFile(db,n){
  const f=genFile(db,n);busy=true;
  line(`<span class="d">otevírám ${esc(db)}/spis_${pad(n)} …</span>`);await sleep(350);
  const d=line(`<div class="idc${f.corrupt?' cor':''}"><img alt="foto" src="https://api.dicebear.com/9.x/personas/svg?seed=${encodeURIComponent(db+'-'+n)}&backgroundColor=d1d5db"><div style="flex:1;min-width:0"><div class="h">IDENTIFIKAČNÍ KARTA · ${f.id}</div>
<b>${esc(f.corrupt?f.name.replace(/[aeiouáéíóú]/gi,'█'):f.name)}</b><br>Nar. ${f.born} · ${f.fem?'Ž':'M'} · ${f.age} let<br>Bydliště: ${esc(f.city)}<br>Výška ${f.h} cm · Oči: ${f.eyes}<br><span class="st ${f.st[1]}">${f.st[0]}</span><div class="bc"></div></div></div>`);await sleep(400);
  if(f.corrupt){await type(`<span class="r glitch">⚠ SPIS #${pad(n)} JE POŠKOZENÝ ⚠\n▓▒░ ${esc(f.name.replace(/[aeiouáéíóú]/gi,'█'))} ░▒▓\nčást dat byla smazána ${f.date}\n> obnoveno 23 %</span>`);}
  await type(`<span class="w">══════════════════════════════════════</span>
<span class="y">  SPIS #${pad(n)}   [${esc(db.toUpperCase())}]   ID ${f.id}</span>
<span class="w">══════════════════════════════════════</span>
  Jméno ........ <span class="w">${esc(f.name)}</span>
  Věk .......... ${f.age}
  Povolání ..... ${esc(f.job)}
  Město ........ ${esc(f.city)}
  Stav ......... <span class="${f.st[1]}">${f.st[0]}</span>

<span class="c">▸ POSLEDNÍ ZÁZNAM</span>
  ${f.date}, ${f.time} — ${esc(f.place)}${f.redact?' <span class="red">██████████</span>':''}

<span class="c">▸ DŮKAZY</span>
${f.clues.map(c=>'  • '+esc(c)).join('\n')}

<span class="c">▸ SVĚDECTVÍ</span>
${f.w.map(c=>'  „'+esc(c)+'“').join('\n')}

<span class="c">▸ POZNÁMKA VYŠETŘOVATELE</span>
  <span class="y">${esc(f.note)}</span>
<span class="w">══════════════════════════════════════</span>`,6);
  busy=false;
}
async function listFiles(db,a,b){
  openDb=db;lastList=[];line(`<span class="d">načítám databázi „${esc(db)}“ …</span>`);await sleep(300);
  line(`<span class="y">📁 ${esc(db)}/  (${b-a+1} složek)</span>  <span class="d">klikni na složku nebo napiš: open ČÍSLO</span>`);
  let h='';for(let n=a;n<=b;n++){const f=genFile(db,n);lastList.push(n);
    h+=`<span class="dir" data-n="${n}">spis_${pad(n)}/</span> <span class="d">${esc(f.corrupt?'▓▒░ POŠKOZENO':f.name)}</span> <span class="${f.st[1]}">${f.st[0]}</span>\n`}
  await type(h,40);
}
function help(){line(`<span class="w">PŘÍKAZY</span>
  file NÁZEV 1-75   vytvoří databázi a ukáže složky 1–75
  file NÁZEV 12     rovnou otevře spis 12
  open 12           otevře spis z poslední databáze
  random            otevře náhodný spis
  search SLOVO      najde spisy podle jména, města nebo důkazu
  ls                vypíše poslední databázi znovu
  clear             vyčistí obrazovku
  date              čas a datum
<span class="d">Stejný název + číslo = vždy stejný spis. Jiný název = úplně jiní lidé.</span>`)}
async function run(c){
  const p=c.trim().split(/\s+/),k=(p[0]||'').toLowerCase();
  if(!k)return;
  if(k==='help'||k==='?')return help();
  if(k==='clear'||k==='cls'){out.innerHTML='';return}
  if(k==='date')return line(new Date().toLocaleString('cs-CZ'));
  if(k==='whoami')return line('agent #047 · přístup: <span class="y">OMEZENÝ</span>');
  if(k==='file'){const db=(p[1]||'').toLowerCase(),rg=p[2]||'';if(!db)return line('<span class="r">použití: file NÁZEV 1-75</span>');
    let m=rg.match(/^(\d+)-(\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];if(b-a>499)return line('<span class="r">max 500 složek najednou</span>');return listFiles(db,Math.max(1,a),b)}
    if(/^\d+$/.test(rg)){openDb=db;return showFile(db,+rg)}return listFiles(db,1,75)}
  if(k==='open'||k==='cd'){const n=parseInt(p[1]);if(!openDb)return line('<span class="r">nejdřív napiš: file NÁZEV 1-75</span>');if(!n)return line('<span class="r">použití: open ČÍSLO</span>');return showFile(openDb,n)}
  if(k==='random'){const db=openDb||'test';openDb=db;return showFile(db,1+Math.floor(Math.random()*(lastList.length||75)))}
  if(k==='ls'||k==='dir'){if(!openDb)return line('<span class="d">(prázdné) napiš: file test 1-75</span>');return listFiles(openDb,lastList[0]||1,lastList[lastList.length-1]||75)}
  if(k==='search'){const q=p.slice(1).join(' ').toLowerCase();if(!openDb||!q)return line('<span class="r">použití: search SLOVO (po příkazu file)</span>');
    const hits=(lastList.length?lastList:[...Array(75)].map((_,i)=>i+1)).map(n=>genFile(openDb,n)).filter(f=>[f.name,f.city,f.place,f.job,...f.clues].join(' ').toLowerCase().includes(q));
    return line(hits.length?hits.map(f=>`<span class="dir" data-n="${f.n}">spis_${pad(f.n)}/</span> <span class="d">${esc(f.name)} · ${esc(f.city)}</span>`).join('\n'):'nic nenalezeno')}
  if(k==='sudo')return line('<span class="r">pěkný pokus 😏 přístup odepřen</span>');
  line(`<span class="r">neznámý příkaz: ${esc(k)}</span> — napiš <span class="w">help</span>`);
}
cmd.addEventListener('keydown',async e=>{
  if(e.key==='Enter'&&!busy){const c=cmd.value;cmd.value='';line(`<span class="d">${document.getElementById('ps').textContent}</span> ${esc(c)}`);if(c.trim()){hist.push(c);hi=hist.length}await run(c)}
  if(e.key==='ArrowUp'&&hi>0){cmd.value=hist[--hi];e.preventDefault()}
  if(e.key==='ArrowDown'){hi=Math.min(hist.length,hi+1);cmd.value=hist[hi]||''}
});
out.addEventListener('click',e=>{const d=e.target.closest('.dir');if(d&&!busy){line(`<span class="d">agent@spisy:~$</span> open ${d.dataset.n}`);showFile(openDb,+d.dataset.n)}});
T.addEventListener('click',e=>{if(!e.target.closest('.dir')&&!getSelection().toString())cmd.focus()});
(async()=>{await type(`<span class="w">SPISY.exe v${VERSION}</span>  ·  archiv nevyřešených případů
<span class="d">[ok] připojení k archivu
[ok] dešifrování
[!!] některé spisy jsou poškozené</span>
<span class="d">Všechny osoby a příběhy jsou smyšlené.</span>
Napiš <span class="w">help</span> nebo zkus: <span class="y">file test 1-75</span>`,8)})();
</script></body></html>
